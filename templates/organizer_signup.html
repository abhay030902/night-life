{% extends "base.html" %}
{% load static %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
    /* Deep Purple Themed Background */
    .signup-wrapper {
        background: radial-gradient(circle at center, #2a0845 0%, #100319 100%);
        min-height: 100vh;
    }

    /* Glassmorphism Card Effect */
    .glass-card {
        background: rgba(20, 20, 25, 0.4);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(176, 38, 255, 0.15); /* Subtle purple border */
        border-radius: 24px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    /* Modern Transparent Inputs */
    .custom-input {
        background-color: rgba(255, 255, 255, 0.05) !important;
        border: 1px solid rgba(176, 38, 255, 0.2) !important;
        color: #ffffff !important;
        border-radius: 12px;
        transition: all 0.3s ease;
    }

    /* Purple Input Focus States */
    .custom-input:focus {
        background-color: rgba(255, 255, 255, 0.1) !important;
        border-color: #b026ff !important;
        box-shadow: 0 0 15px rgba(176, 38, 255, 0.4) !important;
    }

    .custom-input::placeholder {
        color: rgba(255, 255, 255, 0.4) !important;
    }

    /* Styling the File Upload Button specifically */
    .custom-input::file-selector-button {
        background-color: rgba(176, 38, 255, 0.2);
        color: white;
        border: none;
        border-right: 1px solid rgba(176, 38, 255, 0.2);
        padding: 0.5rem 1rem;
        margin-right: 1rem;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .custom-input::file-selector-button:hover {
        background-color: rgba(176, 38, 255, 0.4);
    }

    /* Stylish Muted Labels */
    .custom-label {
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: rgba(255, 255, 255, 0.7);
        font-weight: 600;
        margin-bottom: 0.4rem;
    }

    /* Your Original Purple Gradient Button */
    .gradient-btn {
        background: linear-gradient(45deg, #b026ff, #8a00d4);
        background-size: 200% auto;
        border: none;
        color: white;
        border-radius: 50px;
        transition: all 0.3s ease;
    }

    .gradient-btn:hover {
        background-position: right center;
        transform: translateY(-3px);
        box-shadow: 0 10px 20px rgba(138, 0, 212, 0.5);
        color: white;
    }
    
    /* Purple Links */
    .auth-link {
        color: #b026ff;
        text-decoration: none;
        transition: color 0.3s ease;
    }
    
    .auth-link:hover {
        color: #d884ff;
        text-decoration: underline;
    }
</style>

<div class="signup-wrapper container-fluid d-flex justify-content-center align-items-center py-5">
    <div class="col-11 col-sm-9 col-md-7 col-lg-5 col-xl-4">

        <div class="card p-5 glass-card text-white">

            <div class="text-center mb-5">
                <h2 class="fw-bold mb-1" style="letter-spacing: 1px;">Organizer Signup</h2>
                <p class="text-white-50 small">Create your organizer profile and get started.</p>
            </div>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label custom-label">Full Name</label>
                    <input type="text"
                           name="name"
                           class="form-control form-control-lg custom-input"
                           placeholder="John Doe"
                           pattern="^[A-Za-z ]+$"
                           title="Name should contain only letters"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label custom-label">Email Address</label>
                    <input type="email"
                           name="email"
                           class="form-control form-control-lg custom-input"
                           placeholder="name@example.com"
                           pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
                           title="Enter a valid email address"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label custom-label">Phone Number</label>
                    <input type="tel"
                           name="phone"
                           class="form-control form-control-lg custom-input"
                           placeholder="9876543210"
                           pattern="[6-9]{1}[0-9]{9}"
                           maxlength="10"
                           title="Phone must start with 6-9 and contain 10 digits"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label custom-label">Address</label>
                    <textarea name="address"
                              rows="2"
                              class="form-control custom-input"
                              placeholder="Your full address..."
                              minlength="5"
                              required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label custom-label">Profile Image</label>
                    <input type="file"
                           name="image"
                           class="form-control form-control-lg custom-input"
                           accept="image/*"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label custom-label">ID Proof (Aadhaar / PAN / License)</label>
                    <input type="file"
                           name="id_proof"
                           class="form-control form-control-lg custom-input"
                           accept="image/*,.pdf"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label custom-label">Username</label>
                    <input type="text"
                           name="username"
                           class="form-control form-control-lg custom-input"
                           placeholder="organizer123"
                           pattern="^[A-Za-z0-9]{4,20}$"
                           title="Username must be 4-20 characters and contain only letters and numbers"
                           required>
                </div>

                <div class="mb-4">
                    <label class="form-label custom-label">Password</label>
                    <input type="password"
                           name="password"
                           class="form-control form-control-lg custom-input"
                           placeholder="••••••••"
                           pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,}"
                           title="Password must contain at least 8 characters including uppercase, lowercase and number"
                           required>
                </div>

                {% if error %}
                <div class="alert alert-danger text-center bg-danger bg-opacity-25 border-danger text-light rounded-3 mb-4" style="backdrop-filter: blur(5px);">
                    {{ error }}
                </div>
                {% endif %}

                <button class="btn btn-lg w-100 fw-bold gradient-btn mt-2 py-3">
                    Register as Organizer
                </button>

                <p class="text-center mt-4 mb-0 text-white-50">
                    Already registered?
                    <a href="{% url 'login' %}" class="fw-bold auth-link">Login here</a>
                </p>

            </form>

        </div>
    </div>
</div>

{% endblock %}
