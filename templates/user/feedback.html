{% extends 'user/base.html' %}
{% load static %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

.feedback-wrapper{
min-height:85vh;
display:flex;
align-items:center;
justify-content:center;
padding-top:120px;
padding-bottom:60px;
}

.feedback-card{
width:650px;
background:rgba(20,20,20,0.9);
backdrop-filter:blur(10px);
border-radius:20px;
padding:40px;
box-shadow:0 20px 60px rgba(0,0,0,0.8);
border:1px solid rgba(176,38,255,0.2);
color:white;
}

.feedback-title{
color:#b026ff;
font-weight:700;
margin-bottom:25px;
text-align:center;
}

.star-rating{
display:flex;
flex-direction:row-reverse;
justify-content:center;
gap:10px;
margin-bottom:25px;
}

.star-rating input{
display:none;
}

.star-rating label{
font-size:32px;
color:#555;
cursor:pointer;
transition:0.2s;
}

.star-rating input:checked ~ label{
color:#ffc107;
}

.star-rating label:hover,
.star-rating label:hover ~ label{
color:#ffc107;
}

.comment-box{
background:#0f0f0f;
border:1px solid rgba(255,255,255,0.1);
color:white;
border-radius:10px;
padding:15px;
}

.comment-box:focus{
border-color:#b026ff;
box-shadow:0 0 10px rgba(176,38,255,0.4);
}

.submit-btn{
margin-top:20px;
padding:12px 35px;
border-radius:30px;
background:linear-gradient(45deg,#b026ff,#7928ca);
border:none;
color:white;
font-weight:600;
transition:0.3s;
}

.submit-btn:hover{
transform:translateY(-2px);
box-shadow:0 0 15px rgba(176,38,255,0.6);
}

</style>

<div class="feedback-wrapper">

<div class="feedback-card">

<h3 class="feedback-title">⭐ Event Feedback</h3>

<form method="post">
{% csrf_token %}

<input type="hidden" name="event_id" value="{{ event.id }}">

<div class="text-center mb-3">
<label class="mb-3">Rate your experience</label>

<div class="star-rating">

<input type="radio" name="rating" value="5" id="star5">
<label for="star5">★</label>

<input type="radio" name="rating" value="4" id="star4">
<label for="star4">★</label>

<input type="radio" name="rating" value="3" id="star3">
<label for="star3">★</label>

<input type="radio" name="rating" value="2" id="star2">
<label for="star2">★</label>

<input type="radio" name="rating" value="1" id="star1">
<label for="star1">★</label>

</div>
</div>

<div class="mb-3">
<label class="mb-2">Comment</label>

<textarea name="comment" rows="4" class="form-control comment-box" placeholder="Share your experience..."></textarea>

</div>

<div class="text-center">
<button class="submit-btn">
Submit Feedback
</button>
</div>

</form>

</div>

</div>

{% endblock %}
