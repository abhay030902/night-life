{% extends 'user/base.html' %}
{% load static %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

.payment-wrapper{
min-height:90vh;
display:flex;
align-items:center;
justify-content:center;
padding-top:120px;
padding-bottom:60px;
}

.payment-card{
background: rgba(18,18,18,0.95);
border-radius:22px;
padding:40px;
max-width:600px;
width:100%;
color:white;
box-shadow:0 25px 70px rgba(0,0,0,0.7);
border:1px solid rgba(255,255,255,0.05);
}

.payment-title{
color:#b026ff;
font-weight:700;
margin-bottom:15px;
}

.payment-info{
color:#ddd;
margin-bottom:8px;
}

.total-box{
background:rgba(255,255,255,0.05);
padding:12px 15px;
border-radius:10px;
margin-bottom:20px;
}

.form-control{
background:rgba(255,255,255,0.07);
border:1px solid rgba(255,255,255,0.1);
color:white;
}

.form-control:focus{
background:rgba(255,255,255,0.07);
border-color:#b026ff;
box-shadow:none;
color:white;
}

.pay-btn{
background:linear-gradient(45deg,#28a745,#1e7e34);
border:none;
font-weight:600;
padding:12px;
}

.pay-btn:hover{
transform:translateY(-2px);
box-shadow:0 6px 25px rgba(40,167,69,0.5);
}

.card-icons{
font-size:22px;
opacity:0.7;
}

</style>

<div class="payment-wrapper">

<div class="payment-card">

<h3 class="payment-title">Payment</h3>

<p class="payment-info"><b>Event :</b> {{event.event_name}}</p>
<p class="payment-info"><b>Tickets :</b> {{quantity}}</p>

<div class="total-box">
<b>Total Amount :</b> ₹{{total}}
</div>

<form method="post">

{% csrf_token %}

<input type="hidden" name="event_id" value="{{event.id}}">
<input type="hidden" name="quantity" value="{{quantity}}">

<!-- Card Holder Name -->

<div class="mb-3">
<label class="form-label">Card Holder Name</label>
<input type="text"
class="form-control"
name="card_name"
placeholder="John Doe"
pattern="^[A-Za-z ]+$"
title="Name should contain only letters"
required>
</div>

<!-- Card Number -->

<div class="mb-3">
<label class="form-label">Card Number</label>
<input type="text"
class="form-control"
name="card_number"
placeholder="1234123412341234"
pattern="[0-9]{16}"
maxlength="16"
title="Card number must contain exactly 16 digits"
required>
</div>

<div class="row">

<!-- Expiry -->

<div class="col-md-6 mb-3">
<label class="form-label">Expiry Date</label>
<input type="text"
class="form-control"
name="expiry"
placeholder="MM/YY"
pattern="(0[1-9]|1[0-2])\/[0-9]{2}"
maxlength="5"
title="Enter expiry date in MM/YY format"
required>
</div>

<!-- CVV -->

<div class="col-md-6 mb-3">
<label class="form-label">CVV</label>
<input type="password"
class="form-control"
name="cvv"
maxlength="3"
pattern="[0-9]{3}"
placeholder="123"
title="CVV must contain 3 digits"
required>
</div>

</div>

<button class="btn pay-btn w-100 text-white">

Pay ₹{{total}}

</button>

</form>

</div>

</div>

{% endblock %}
