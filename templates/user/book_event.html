{% extends 'user/base.html' %}
{% load static %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

.booking-wrapper{
min-height:90vh;
display:flex;
align-items:center;
justify-content:center;
padding-top:120px;
padding-bottom:60px;
}

.booking-card{
background: rgba(20,20,20,0.9);
border-radius:20px;
padding:40px;
max-width:550px;
width:100%;
color:white;
box-shadow:0 20px 60px rgba(0,0,0,0.6);
border:1px solid rgba(255,255,255,0.05);
}

.event-title{
color:#b026ff;
font-weight:bold;
margin-bottom:10px;
}

.book-btn{
background:linear-gradient(45deg,#b026ff,#8a00d4);
border:none;
}

.book-btn:hover{
transform:translateY(-2px);
box-shadow:0 6px 20px rgba(176,38,255,0.5);
}

</style>

<div class="booking-wrapper">

<div class="booking-card">

<h3 class="event-title">{{event.event_name}}</h3>

<p>{{event.description}}</p>

<hr style="border-color:rgba(255,255,255,0.1)">

<p><b>Price :</b> ₹{{event.price}}</p>

<p><b>Total Tickets :</b> {{event.total_tickets}}</p>

<form method="post">

{% csrf_token %}

<input type="hidden" name="event_id" value="{{event.id}}">

<div class="mb-3">

<label class="form-label">Number of Tickets</label>

<input type="number"
name="quantity"
class="form-control"
min="1"
max="{{event.total_tickets}}"
required>

</div>

<button class="btn book-btn w-100 text-white">

Continue to Payment

</button>

</form>

</div>

</div>

{% endblock %}
