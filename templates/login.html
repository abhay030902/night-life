{% extends "base.html" %}
{% load static %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container min-vh-100 d-flex justify-content-center align-items-center">
    <div class="col-11 col-sm-9 col-md-6 col-lg-4">

        <div class="card p-5 shadow-lg text-white"
             style="background: rgba(0,0,0,0.45); border-radius: 24px;">

            <h2 class="text-center fw-bold mb-4">Login</h2>

            <form method="post">
                {% csrf_token %}

                <div class="mb-4">
                    <label class="form-label fs-5">Username</label>
                    <input type="text" name="username"
                           class="form-control form-control-lg" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fs-5">Password</label>
                    <input type="password" name="password"
                           class="form-control form-control-lg" required>
                </div>

                {% if error %}
                <div class="alert alert-danger text-center">
                    {{ error }}
                </div>
                {% endif %}

                <button class="btn btn-lg w-100 rounded-pill fw-semibold"
                        style="background: linear-gradient(45deg,#b026ff,#8a00d4); color:white;">
                    Login
                </button>
            </form>

        </div>
    </div>
</div>

{% endblock %}
