{% extends "organizer/base.html" %}
{% load static %}
{% block content %}

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<div class="container min-vh-100 d-flex justify-content-center align-items-center">

    <div class="col-11 col-sm-10 col-md-8 col-lg-6">

        <div class="card shadow-lg p-5 text-white"
             style="background: rgba(8,6,6,0.55); border-radius:20px; backdrop-filter: blur(8px);">

            <h2 class="text-center fw-bold mb-4">Edit Event</h2>

            <form method="post" enctype="multipart/form-data">

                {% csrf_token %}
                <input type="hidden" name="id" value="{{ event.id }}">

                <div class="mb-3">
                    <label class="form-label">Event Name</label>
                    <input type="text" name="event_name"
                           value="{{ event.event_name }}"
                           class="form-control form-control-lg">
                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="event_date"
                               value="{{ event.event_date|date:'Y-m-d' }}"
                               class="form-control form-control-lg">
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label">Time</label>
                        <input type="time" name="event_time"
                               value="{{ event.event_time|time:'H:i' }}"
                               class="form-control form-control-lg">
                    </div>

                </div>

                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" name="location"
                           value="{{ event.location }}"
                           class="form-control form-control-lg">
                </div>

                <div class="mb-3">
                    <label class="form-label">Price</label>
                    <input type="number" name="price"
                           value="{{ event.price }}"
                           class="form-control form-control-lg">
                </div>

                <div class="mb-3">
                    <label class="form-label">Total Tickets</label>
                    <input type="number" name="total_tickets"
                           value="{{ event.total_tickets }}"
                           class="form-control form-control-lg">
                </div>

                <div class="mb-3 text-center">
                    <label class="form-label">Current Image</label><br>

                    {% if event.event_image %}
                    <img src="{{ event.event_image.url }}"
                         style="width:100%; max-height:220px; object-fit:cover; border-radius:12px;">
                    {% else %}
                    <p>No Image</p>
                    {% endif %}

                </div>

                <div class="mb-3">
                    <label class="form-label">Change Image</label>
                    <input type="file" name="event_image"
                           class="form-control form-control-lg">
                </div>

                <div class="mb-4">
                    <label class="form-label">Description</label>
                    <textarea name="description"
                              rows="3"
                              class="form-control form-control-lg">{{ event.description }}</textarea>
                </div>

                <button class="btn w-100 btn-lg rounded-pill fw-semibold"
                        style="background: linear-gradient(45deg,#b026ff,#8a00d4); color:white;">
                    Update Event
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
